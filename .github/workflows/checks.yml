name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Playback integration checks
        run: python tests/verify_playback.py
      - name: Resume dialog regression checks
        run: python tests/verify_resume_prompt.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build source bundle
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          files = ['xidian_playback.py', 'start.bat', 'requirements.txt', 'README.md', 'LICENSE', 'VERSION', 'CHANGELOG.md']
          Path('dist').mkdir()
          output = Path('dist') / ('xidian-playback-helper-' + os.environ['GITHUB_REF_NAME'] + '.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name)
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
